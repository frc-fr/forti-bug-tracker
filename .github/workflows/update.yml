name: Update data and site

on:
  schedule:
    - cron: "15 9,14 * * 1-5"
      timezone: "Europe/Paris"
    - cron: "0 19 * * 1-5"
      timezone: "Europe/Paris"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e '.[dev]'

      - name: Test
        run: |
          pytest
          node --test tests/site/logic.test.js

      # The PDFs are not versioned: the cache only spares downloading them again.
      - uses: actions/cache@v4
        with:
          path: .cache/pdfs
          key: pdfs-${{ github.run_id }}
          restore-keys: pdfs-

      # Dormant branches are only checked on Mondays and on manual runs.
      - name: Collect the Release Notes
        run: |
          if [ "$(date +%u)" = 1 ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            fortibugs collect --all
          else
            fortibugs collect
          fi

      # Any warning stops here: the site keeps its last valid data.
      - name: Extract the bugs
        run: fortibugs extract

      - name: Check the real PDFs
        run: FORTIBUGS_CACHE=.cache/pdfs pytest tests/test_corpus.py

      - name: Commit the data
        run: |
          git add sources data
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update FortiOS data"
            git push
          fi

      - name: Build the site
        run: fortibugs build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
